<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:20px 24px;justify-content:center;gap:8px">
  <div style="font-family:Poppins;font-weight:600;font-size:1.3rem;color:#4B17E5">Official brand gradients · page C2</div>
  <div class="row" style="gap:10px">
    <div class="swatch" style="background:linear-gradient(180deg,#320F99 0%,#4B17E5 100%);flex:1;min-height:110px">
      <span class="name" style="font-family:Poppins;font-weight:600">Purple Gradient</span>
      <span class="hex" style="font-family:Poppins">MOI Dark → MOI Main</span></div>
    <div class="swatch light" style="background:linear-gradient(180deg,#BFBFBF 0%,#FFFFFF 100%);flex:1;min-height:110px;color:#0A051A">
      <span class="name" style="font-family:Poppins;font-weight:600">White Gradient</span>
      <span class="hex" style="font-family:Poppins">MOI Grey → MOI White</span></div>
    <div class="swatch" style="background:radial-gradient(circle at 30% 25%,#6F45EA 0%,#4B17E5 55%,#320F99 100%);flex:1;min-height:110px;box-shadow:inset 0 1.45px 33px rgba(255,255,255,0.25)">
      <span class="name" style="font-family:Poppins;font-weight:600">Orb (radial)</span>
      <span class="hex" style="font-family:Poppins">used on planetoid + bubbles</span></div>
  </div>
</body></html>
