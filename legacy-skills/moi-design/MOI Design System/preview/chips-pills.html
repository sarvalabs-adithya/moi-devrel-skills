<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:24px 28px;justify-content:center">
  <div class="eyebrow">Chips, badges, status pills</div>
  <div class="row" style="gap:10px">
    <span style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#F0EBFF;color:#4B17E5;font-family:var(--font-mono);font-weight:700;font-size:1.2rem;text-transform:uppercase;letter-spacing:.08em;border:1px solid #D9CEFA">
      <span style="width:6px;height:6px;border-radius:50%;background:#4B17E5"></span>OFFICIAL STATEMENT</span>
    <span style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#fff;color:#1FAE6B;font-family:var(--font-mono);font-weight:600;font-size:1.3rem;border:1px solid rgba(31,174,107,.3)">
      <span style="width:6px;height:6px;border-radius:50%;background:#1FAE6B"></span>scope · active</span>
    <span style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#fff;color:#E2336B;font-family:var(--font-mono);font-weight:600;font-size:1.3rem;border:1px solid rgba(226,51,107,.3)">
      <span style="width:6px;height:6px;border-radius:50%;background:#E2336B"></span>revoked</span>
    <span style="display:inline-flex;padding:6px 12px;border-radius:999px;background:#0A0026;color:#9871F2;font-family:var(--font-mono);font-weight:700;font-size:1.2rem;text-transform:uppercase;letter-spacing:.08em">@MOI_Tech</span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:linear-gradient(180deg,#4B17E5,#320F99);color:#F5F2FF;font-family:var(--font-sans);font-weight:600;font-size:1.4rem">2,100+ Validators</span>
  </div>
</body></html>
