<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <title>MOI · The on-chain authority layer for AI agents</title>
  <link rel="icon" type="image/png" href="../../assets/logos/PNG/Padded - Dark - 280px.png" />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    body { margin: 0; }
    @keyframes slideIn { from { transform: translateY(20px); opacity: 0 } to { transform: none; opacity: 1 } }
    @keyframes orbitSpin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
    @keyframes pipFloat { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
    .pip-orbit img { animation: pipFloat 8s ease-in-out infinite; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--moi-main); outline-offset: 4px; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel">
    function App() {
      const [activeIdx, setActiveIdx] = React.useState(0);
      const [toastOpen, setToastOpen] = React.useState(false);
      const showToast = () => { setToastOpen(true); setTimeout(() => setToastOpen(false), 4500); };
      return (
        <>
          <Nav onCta={showToast} />
          <Hero onCta={showToast} />
          <FourWays activeIdx={activeIdx} setActiveIdx={setActiveIdx} />
          <StoryBand />
          <ValidatorsBand />
          <CtaBand onCta={showToast} />
          <Footer />
          <RevokedToast open={toastOpen} onClose={() => setToastOpen(false)} />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
