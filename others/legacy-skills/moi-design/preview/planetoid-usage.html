<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:20px 24px;justify-content:center;gap:8px;font-family:Poppins">
  <div style="font-family:Poppins;font-weight:600;font-size:1.3rem;color:#4B17E5">Planetoid · the shape behind everything · page B1–B2</div>
  <div class="row" style="gap:14px;align-items:stretch">
    <!-- 1. solid watermark -->
    <div style="flex:1;background:#F5F2FF;border-radius:14px;padding:14px;position:relative;overflow:hidden;min-height:120px">
      <span style="font-family:Poppins;font-weight:600;font-size:1.3rem;color:#0A051A;position:relative">As solid watermark</span>
      <img src="../assets/logos/PNG/Default - Dark - 1000px.png" style="position:absolute;right:-30px;bottom:-30px;width:150px;opacity:1"/>
    </div>
    <!-- 2. mask for media -->
    <div style="flex:1;border-radius:14px;background:#fff;padding:14px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between">
      <span style="font-family:Poppins;font-weight:600;font-size:1.3rem;color:#0A051A">As mask for media</span>
      <div style="height:80px;background:linear-gradient(180deg,#0A0026,#4B17E5),url(../assets/backgrounds/cosmic-purple.png);background-blend-mode:overlay;-webkit-mask:url(../assets/logos/SVG/Default - Dark.svg) center/contain no-repeat;mask:url(../assets/logos/SVG/Default - Dark.svg) center/contain no-repeat;align-self:center;width:140px"></div>
    </div>
    <!-- 3. outline -->
    <div style="flex:1;background:#F5F2FF;border-radius:14px;padding:14px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between">
      <span style="font-family:Poppins;font-weight:600;font-size:1.3rem;color:#0A051A">As outline (background only)</span>
      <img src="../assets/logos/SVG/Default - Dark.svg" style="height:80px;align-self:center;opacity:0.2;filter:saturate(0) brightness(0.6)"/>
    </div>
  </div>
</body></html>
