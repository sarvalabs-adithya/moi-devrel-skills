<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOI deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   =========================================== */
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--stage-bg,#000); }
.deck-viewport { position:fixed; inset:0; overflow:hidden; background:var(--stage-bg,#000); }
.deck-stage { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; transform-origin:0 0; background:var(--slide-bg,#fff); }
.slide { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; display:block; visibility:hidden; opacity:0; pointer-events:none; background:var(--slide-bg,#fff); }
.slide.active, .slide.visible { visibility:visible; opacity:1; pointer-events:auto; z-index:1; }
img, video, canvas, svg { max-width:100%; max-height:100%; }
.deck-controls { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:1000; }
@media print {
  html, body { width:1920px; height:auto; overflow:visible; background:#fff; }
  .deck-viewport { position:static; overflow:visible; background:#fff; }
  .deck-stage { position:static; width:auto; height:auto; transform:none !important; background:none; }
  .slide { position:relative; display:block !important; visibility:visible !important; opacity:1 !important; pointer-events:auto !important; width:1920px; height:1080px; break-after:page; page-break-after:always; }
  .slide:last-child { break-after:auto; page-break-after:auto; }
  .deck-controls { display:none !important; }
  /* reveals never animate on paper: force them visible or every page prints blank */
  .slide .rv { opacity:1 !important; transform:none !important; animation:none !important; }
}
@page { size: 1920px 1080px; margin: 0; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:0.01ms !important; transition-duration:0.2s !important; }
}

/* ===========================================
   MOI BRAND TOKENS
   =========================================== */
:root {
  --moi-main:#4B17E5;
  --moi-dark:#320F99;
  --moi-white:#FFFFFF;
  --moi-grey:#BFBFBF;
  --moi-black:#0A0026;
  --bg-almost-lavender:#FCFBFF;
  --bg-certainly-lavender:#F5F2FF;
  --bg-pastel-purple:#D9CCFF;
  --lav-accent:#BCA6FF;
  /* text on light */
  --ink-hi:rgba(10,5,26,.85);
  --ink-mid:rgba(10,5,26,.69);
  --ink-low:rgba(10,5,26,.55);
  /* text on dark */
  --snow-hi:rgba(255,255,255,.85);
  --snow-mid:rgba(255,255,255,.69);
  --snow-low:rgba(255,255,255,.55);
  --stage-bg:#0A0026;
  --slide-bg:#FCFBFF;
}

/* ===========================================
   TYPE
   =========================================== */
.slide { font-family:'Poppins', sans-serif; font-weight:400; -webkit-font-smoothing:antialiased; }
.chip {
  display:inline-block; font-weight:600; font-size:22px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--moi-main); background:var(--bg-certainly-lavender);
  border:1.5px solid var(--bg-pastel-purple); border-radius:999px; padding:10px 28px;
}
.slide.dark .chip { color:var(--lav-accent); background:rgba(255,255,255,.06); border-color:rgba(188,166,255,.35); }

h1 { font-weight:700; font-size:112px; line-height:1.08; margin:0; letter-spacing:-0.01em; }
h2 { font-weight:600; font-size:76px; line-height:1.12; margin:0; letter-spacing:-0.01em; color:var(--ink-hi); }
.slide.dark h1, .slide.dark h2 { color:var(--snow-hi); }
.sub { font-weight:400; font-size:36px; line-height:1.5; color:var(--ink-mid); }
.slide.dark .sub { color:var(--snow-mid); }
.accent { color:var(--moi-main); }
.slide.dark .accent { color:var(--lav-accent); }

/* ===========================================
   LAYOUT
   =========================================== */
.pad { position:absolute; inset:0; padding:110px 140px; box-sizing:border-box; display:flex; flex-direction:column; }
.slide.light { background:var(--bg-almost-lavender); }
.slide.lav   { background:var(--bg-certainly-lavender); }
.slide.dark  { background:var(--moi-black); }
.slide.dark.grad { background:linear-gradient(160deg, #14063f 0%, var(--moi-black) 55%); }

.corner-logo { position:absolute; top:58px; right:72px; width:96px; height:auto; opacity:.9; }
.slide-num { position:absolute; bottom:56px; right:72px; font-weight:600; font-size:20px; letter-spacing:.08em; color:var(--ink-low); }
.slide.dark .slide-num { color:var(--snow-low); }

.dia { width:1620px; height:auto; display:block; }
.slide.dark .dia { color:var(--snow-hi); }

/* planetoid watermark */
.planetoid { position:absolute; pointer-events:none; }

/* cards */
.cards { display:flex; gap:36px; }
.card {
  flex:1; background:var(--moi-white); border:1.5px solid var(--bg-pastel-purple); border-radius:28px;
  padding:44px 48px; box-sizing:border-box;
}
.card .k { font-weight:600; font-size:22px; letter-spacing:.08em; text-transform:uppercase; color:var(--moi-main); margin-bottom:18px; }
.card .v { font-weight:500; font-size:34px; line-height:1.3; color:var(--ink-hi); }
.card .d { font-weight:400; font-size:24px; line-height:1.5; color:var(--ink-mid); margin-top:14px; }

/* code: the one non-Poppins surface, because code is content, not brand voice */
.code {
  font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  font-size:27px; line-height:1.62; color:var(--snow-hi);
  background:var(--moi-black); border-radius:24px; padding:44px 56px;
  white-space:pre; overflow:hidden;
}
.code .c  { color:rgba(255,255,255,.42); }         /* comment */
.code .kw { color:var(--lav-accent); }             /* keyword */
.code .s  { color:#9EE8C1; }                       /* string  */

/* beats */
.beats { display:flex; gap:40px; }
.beat { flex:1; border-radius:28px; padding:48px; box-sizing:border-box; text-align:center; }
.beat .n { font-weight:700; font-size:26px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:22px; }
.beat .r { font-weight:700; font-size:58px; line-height:1.1; }
.beat .m { font-weight:400; font-size:24px; margin-top:20px; line-height:1.4; }
.beat.no  { background:rgba(255,255,255,.05); border:1.5px solid rgba(255,255,255,.14); }
.beat.no  .n { color:var(--snow-low); } .beat.no .r { color:var(--snow-hi); } .beat.no .m { color:var(--snow-mid); }
.beat.yes { background:var(--moi-main); }
.beat.yes .n { color:rgba(255,255,255,.7); } .beat.yes .r { color:#fff; } .beat.yes .m { color:rgba(255,255,255,.8); }

/* table */
table.cmp { border-collapse:separate; border-spacing:0; width:100%; font-size:30px; }
.cmp th { font-weight:600; font-size:22px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-low); text-align:left; padding:18px 36px; }
.cmp td { background:var(--moi-white); color:var(--ink-hi); font-weight:500; padding:30px 36px; border-top:1.5px solid var(--bg-pastel-purple); }
.cmp tr td:first-child { font-weight:600; }
.cmp tr.hero td { background:var(--moi-main); color:#fff; border-top-color:var(--moi-main); }
.cmp tr:first-child td:first-child { border-top-left-radius:24px; } .cmp tr:first-child td:last-child { border-top-right-radius:24px; }
.cmp tr:last-child td:first-child { border-bottom-left-radius:24px; } .cmp tr:last-child td:last-child { border-bottom-right-radius:24px; }

/* pills row */
.pills { display:flex; gap:28px; }
.pill { border-radius:999px; padding:20px 44px; font-weight:600; font-size:30px; letter-spacing:.06em; text-transform:uppercase; }
.pill.live { background:var(--moi-main); color:#fff; }
.pill.res  { background:transparent; border:2px solid var(--bg-pastel-purple); color:var(--ink-low); }

/* staggered reveal */
.slide .rv { opacity:0; transform:translateY(26px); }
.slide.active .rv { animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
.slide.active .rv.d1 { animation-delay:.08s; } .slide.active .rv.d2 { animation-delay:.2s; }
.slide.active .rv.d3 { animation-delay:.34s; } .slide.active .rv.d4 { animation-delay:.48s; }
.slide.active .rv.d5 { animation-delay:.62s; }
@keyframes rise { to { opacity:1; transform:none; } }

/* progress dots */
.deck-controls { display:flex; gap:10px; }
.dot { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.25); border:0; padding:0; cursor:pointer; }
.dot.on { background:var(--lav-accent); }

/* further components, same tokens */
.slide.dark .card { background:rgba(255,255,255,.05); border-color:rgba(188,166,255,.35); }
.slide.dark .card .k { color:var(--lav-accent); } .slide.dark .card .v { color:var(--snow-hi); } .slide.dark .card .d { color:var(--snow-mid); }
.card ul { margin:16px 0 0; padding-left:26px; font-size:24px; line-height:1.55; color:var(--ink-mid); }
.slide.dark .card ul { color:var(--snow-mid); }
.card ul li { margin:6px 0; }
.stats { display:flex; gap:40px; }
.stat { flex:1; background:var(--moi-white); border:1.5px solid var(--bg-pastel-purple); border-radius:28px; padding:30px 44px; box-sizing:border-box; }
.stat .n { font-weight:700; font-size:64px; line-height:1; color:var(--moi-main); letter-spacing:-.02em; }
.stat .l { font-weight:600; font-size:19px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-low); margin-top:12px; }
.beat .n .num { display:block; font-size:44px; margin-bottom:10px; letter-spacing:0; }
.beat.no .r { font-size:30px; line-height:1.35; font-weight:500; }
.cmp td .t { display:block; font-size:22px; font-weight:400; color:var(--ink-mid); margin-top:6px; }
.cmp tr.hero td .t { color:rgba(255,255,255,.8); }
.cmp th:first-child { width:240px; }
.steps { display:flex; flex-direction:column; gap:22px; }
.step { display:flex; align-items:center; gap:36px; font-size:30px; color:var(--snow-mid); }
.step .c { font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:30px; color:var(--lav-accent); min-width:620px; }
.card .cdia { display:block; width:100%; height:auto; max-height:none; margin-top:22px; color:rgba(10,5,26,.62); }
.mono { font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:.92em; background:rgba(75,23,229,.08); color:var(--moi-dark); padding:.06em .32em; border-radius:6px; }
.slide.dark .mono { background:rgba(255,255,255,.09); color:var(--lav-accent); }
.cards.tight .card { padding:36px 40px; }
.ghost-num { position:absolute; right:40px; top:50%; transform:translateY(-48%); font-weight:800; font-size:760px; line-height:.8; color:rgba(188,166,255,.07); letter-spacing:-.06em; pointer-events:none; user-select:none; }
.photos { display:flex; gap:36px; }
.photo { flex:1; position:relative; aspect-ratio:4/3; border-radius:28px; overflow:hidden; background:rgba(255,255,255,.05); border:1.5px dashed rgba(188,166,255,.45); }
.slide.light .photo, .slide.lav .photo { background:var(--moi-white); border-color:var(--bg-pastel-purple); }
.photo:has(img) { border-style:solid; border-color:rgba(188,166,255,.28); }
.slide.light .photo:has(img), .slide.lav .photo:has(img) { border-color:var(--bg-pastel-purple); }
.photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.photo .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 28px; font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:20px; line-height:1.5; color:var(--snow-low); }
.slide.light .photo .ph, .slide.lav .photo .ph { color:var(--ink-low); }
.stat .elogo { display:block; height:42px; width:auto; max-width:200px; object-fit:contain; margin-bottom:16px; }
.stats.four { gap:28px; }
.stats.four .stat { padding:28px 32px; }

/* guest speaker: the headshot leads, top-aligned beside name, role, company, logo and topic.
   Both images are files the host supplies; until they exist the frames say which file and size. */
.guest { display:grid; grid-template-columns:720px 1fr; column-gap:110px; align-items:start; }
.gshot { position:relative; width:720px; height:720px; }
.gshot::before { content:""; position:absolute; inset:-120px; border-radius:50%; pointer-events:none;
  background:radial-gradient(closest-side, rgba(152,113,242,.34), rgba(152,113,242,0)); }
.gshot .frame { position:absolute; inset:0; border-radius:56px; overflow:hidden;
  background:rgba(255,255,255,.04); border:2px dashed rgba(188,166,255,.5);
  box-shadow:0 0 80px rgba(152,113,242,.30), 0 40px 90px -30px rgba(75,23,229,.55); }
.gshot .frame:has(img) { border:2px solid rgba(188,166,255,.4); }
.gshot img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 30%; display:block; }
.gshot .ph, .glogo .ph { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; color:var(--snow-low); }
.gshot .ph { gap:12px; font-size:22px; line-height:1.4; }
.gshot .ph svg { width:220px; height:auto; margin-bottom:22px; color:rgba(188,166,255,.55); }
.gshot .ph b { font-weight:600; color:var(--lav-accent); font-size:24px; }
.gtext { padding-top:6px; }
.gname { font-weight:600; font-size:96px; line-height:1.05; letter-spacing:-.015em; margin:40px 0 0; color:var(--snow-hi); }
.grole { font-weight:500; font-size:38px; line-height:1.35; margin-top:26px; color:var(--snow-hi); }
.gco { font-weight:600; font-size:38px; line-height:1.35; margin-top:4px; color:var(--lav-accent); }
.glogo { position:relative; margin-top:44px; width:400px; height:132px; border-radius:24px; box-sizing:border-box;
  background:rgba(255,255,255,.04); border:2px dashed rgba(188,166,255,.5); }
.glogo:has(img) { background:#fff; border:2px solid #fff; }
.glogo img { position:absolute; inset:24px 36px; width:calc(100% - 72px); height:calc(100% - 48px); object-fit:contain; display:block; }
.glogo .ph { gap:6px; font-size:19px; line-height:1.35; }
.glogo .ph b { font-weight:600; color:var(--lav-accent); font-size:20px; }
.gshot .frame:has(img) .ph, .glogo:has(img) .ph { display:none; }
.grole:has(.slot), .gco:has(.slot) { margin-bottom:10px; }
.glogo.mark { width:132px; }
.glogo.mark img { inset:18px; width:calc(100% - 36px); height:calc(100% - 36px); }
.glogo.mark .ph { font-size:15px; padding:0 8px; }
.glogo.mark .ph b { font-size:15px; }
.glogo.knock:has(img) { background:var(--moi-black); border-color:rgba(188,166,255,.35); }
.gtopic { margin-top:56px; padding-left:32px; border-left:4px solid var(--lav-accent); }
.gtopic .k { font-weight:600; font-size:22px; letter-spacing:.08em; text-transform:uppercase; color:var(--lav-accent); }
.gtopic .t { font-weight:500; font-size:38px; line-height:1.35; margin-top:12px; color:var(--snow-hi); }
.slot { display:inline-block; font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-weight:400; font-size:24px;
  letter-spacing:0; line-height:1.4; padding:8px 18px; border-radius:12px; border:2px dashed rgba(188,166,255,.5); color:var(--snow-low); vertical-align:middle; }
/* the same component on a light or lav slide */
.slide.light .gshot .frame, .slide.lav .gshot .frame { background:var(--moi-white); border-color:var(--lav-accent);
  box-shadow:0 0 80px rgba(152,113,242,.22), 0 40px 90px -36px rgba(75,23,229,.40); }
.slide.light .gshot .frame:has(img), .slide.lav .gshot .frame:has(img) { border:2px solid var(--bg-pastel-purple); }
.slide.light .gshot::before, .slide.lav .gshot::before { background:radial-gradient(closest-side, rgba(152,113,242,.22), rgba(152,113,242,0)); }
.slide.light .gshot .ph, .slide.lav .gshot .ph, .slide.light .glogo .ph, .slide.lav .glogo .ph, .slide.light .slot, .slide.lav .slot { color:var(--ink-low); }
.slide.light .gshot .ph svg, .slide.lav .gshot .ph svg { color:var(--lav-accent); }
.slide.light .gshot .ph b, .slide.lav .gshot .ph b, .slide.light .glogo .ph b, .slide.lav .glogo .ph b { color:var(--moi-main); }
.slide.light .gname, .slide.lav .gname, .slide.light .grole, .slide.lav .grole, .slide.light .gtopic .t, .slide.lav .gtopic .t { color:var(--ink-hi); }
.slide.light .gco, .slide.lav .gco, .slide.light .gtopic .k, .slide.lav .gtopic .k { color:var(--moi-main); }
.slide.light .gtopic, .slide.lav .gtopic { border-left-color:var(--moi-main); }
.slide.light .glogo, .slide.lav .glogo { background:var(--moi-white); border-color:var(--lav-accent); }
.slide.light .glogo:has(img), .slide.lav .glogo:has(img) { border:2px solid var(--bg-pastel-purple); }
.slide.light .slot, .slide.lav .slot { border-color:var(--lav-accent); }
</style>
</head>

<div class="deck-stage" id="stage">

<section class="slide dark grad">
  <div class="ghost-num">01</div>
  <div class="pad" style="justify-content:center">
    <svg class="rv" style="width:190px;height:auto;margin-bottom:70px" viewBox="0 0 26 20"><use href="#moiOnDark"/></svg>
    <div class="rv d1"><span class="chip">Chip label &middot; Month Year</span></div>
    <h1 class="rv d2" style="margin-top:44px; max-width:1500px">Deck <span class="accent">title</span></h1>
    <div class="rv d3 sub" style="margin-top:36px; max-width:1400px">One line under the title.</div>
  </div>
</section>
<nav class="deck-controls" id="dots" aria-label="Slide navigation"></nav>
</div>
</div>
<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var stage = document.getElementById('stage');
  var dots = document.getElementById('dots');
  var i = 0;

  // Presenter view. Press P to open a second window with the read-along script,
  // synced to the deck. In Meet, share THIS window and keep the presenter window
  // on your own screen. One TITLES entry and one NOTES entry per slide, in slide
  // order. NOTES are JavaScript strings: write \n for a line break, never a real one.
  var TITLES = [
      "Title"
];
  var NOTES = [
      "Speaker script for slide 1."
];

  var pw = null, t0 = null;
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function openPresenter() {
    pw = window.open('', 'moi-presenter', 'width=980,height=760');
    if (!pw) return;
    t0 = t0 || Date.now();
    var d = pw.document;
    d.open();
    d.write('<title>Presenter: ' + esc(document.title) + '</title>' +
      '<style>body{margin:0;background:#0A0026;color:rgba(255,255,255,.85);font-family:Poppins,system-ui,sans-serif;padding:34px 44px;line-height:1.65}' +
      '#hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(188,166,255,.25);padding-bottom:14px}' +
      '#num{font-weight:600;letter-spacing:.08em;color:#BCA6FF;font-size:14px;text-transform:uppercase}' +
      '#clk{font-size:14px;color:rgba(255,255,255,.55)}' +
      '#ttl{font-size:30px;font-weight:600;margin:18px 0 6px}' +
      '#nts{font-size:21px;max-width:850px;white-space:pre-wrap}' +
      '#nxt{margin-top:26px;font-size:14px;color:rgba(255,255,255,.55)}#nxt b{color:#BCA6FF}' +
      '#hint{position:fixed;bottom:12px;left:44px;font-size:12px;color:rgba(255,255,255,.35)}</style>' +
      '<div id="hd"><span id="num"></span><span id="clk">00:00</span></div>' +
      '<div id="ttl"></div><div id="nts"></div><div id="nxt"></div>' +
      '<div id="hint">Arrow keys work here too and drive the deck.</div>');
    d.close();
    d.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') go(i + 1);
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(i - 1);
    });
    pw.setInterval(function () {
      var s = Math.floor((Date.now() - t0) / 1000);
      var el = pw.document.getElementById('clk');
      if (el) el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }, 1000);
    updatePresenter();
  }

  function updatePresenter() {
    if (!pw || pw.closed) return;
    var d = pw.document;
    d.getElementById('num').textContent = 'Slide ' + (i + 1) + ' / ' + slides.length;
    d.getElementById('ttl').textContent = TITLES[i] || '';
    d.getElementById('nts').textContent = NOTES[i] || '';
    var nx = d.getElementById('nxt');
    nx.textContent = i + 1 < slides.length ? 'Next: ' : 'Last slide.';
    if (i + 1 < slides.length) { var b = d.createElement('b'); b.textContent = TITLES[i + 1] || ''; nx.appendChild(b); }
  }

  slides.forEach(function (_, n) {
    var b = document.createElement('button');
    b.className = 'dot'; b.setAttribute('aria-label', 'Slide ' + (n + 1));
    b.addEventListener('click', function () { go(n); });
    dots.appendChild(b);
  });

  function go(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, k) { s.classList.toggle('active', k === i); });
    Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle('on', k === i); });
    location.hash = i + 1;
    updatePresenter();
  }

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'translate(' +
      (window.innerWidth - 1920 * s) / 2 + 'px,' +
      (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
  }

  window.addEventListener('resize', fit);
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') go(i + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(i - 1);
    if (e.key === 'Home') go(0);
    if (e.key === 'End') go(slides.length - 1);
    if (e.key === 'p' || e.key === 'P') openPresenter();
  });
  document.addEventListener('click', function (e) {
    if (e.target.closest('.deck-controls')) return;
    go(i + (e.clientX > window.innerWidth / 2 ? 1 : -1));
  });

  fit();
  go((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>
</body>
</html>
