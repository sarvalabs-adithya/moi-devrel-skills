<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:20px 24px;justify-content:center;gap:10px;font-family:Poppins">
  <div style="font-family:Poppins;font-weight:600;font-size:1.3rem;color:#E2336B">Logo · DON'T · page A4</div>
  <div class="row" style="gap:14px;align-items:flex-end;flex-wrap:wrap">
    <div class="col" style="align-items:center;gap:4px">
      <span style="font-family:Poppins;font-weight:700;font-size:2.0rem;color:#320F99;text-decoration:line-through">MOI</span>
      <span style="font-family:Poppins;font-size:1.1rem;color:rgba(10,5,26,.55);text-align:center;max-width:120px">Wordmark by itself</span>
    </div>
    <div class="col" style="align-items:center;gap:4px">
      <img src="../assets/logos/SVG/Default - Light.svg" style="height:48px;transform:rotate(15deg)"/>
      <span style="font-family:Poppins;font-size:1.1rem;color:rgba(10,5,26,.55);text-align:center;max-width:120px">Rotate</span>
    </div>
    <div class="col" style="align-items:center;gap:4px">
      <img src="../assets/logos/SVG/Default - Light.svg" style="height:48px;transform:scaleX(1.6)"/>
      <span style="font-family:Poppins;font-size:1.1rem;color:rgba(10,5,26,.55);text-align:center;max-width:120px">Warp</span>
    </div>
    <div class="col" style="align-items:center;gap:4px">
      <img src="../assets/logos/SVG/Default - Light.svg" style="height:48px;filter:hue-rotate(120deg)"/>
      <span style="font-family:Poppins;font-size:1.1rem;color:rgba(10,5,26,.55);text-align:center;max-width:120px">Change colours</span>
    </div>
    <div class="col" style="align-items:center;gap:4px">
      <img src="../assets/logos/SVG/Default - Light.svg" style="height:48px;filter:drop-shadow(0 4px 8px #4B17E5) drop-shadow(0 0 8px #4B17E5)"/>
      <span style="font-family:Poppins;font-size:1.1rem;color:rgba(10,5,26,.55);text-align:center;max-width:120px">Add shadow / effects</span>
    </div>
    <div class="col" style="align-items:center;gap:4px">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-family:Poppins;font-weight:700;font-size:1.8rem;color:#320F99">MOI</span>
        <img src="../assets/logos/SVG/Planetoid - Light.svg" alt="" style="height:32px"/>
      </div>
      <span style="font-family:Poppins;font-size:1.1rem;color:rgba(10,5,26,.55);text-align:center;max-width:120px">Switch placement (planet must be left)</span>
    </div>
    <div class="col" style="align-items:center;gap:4px">
      <img src="../assets/logos/SVG/Default - Light.svg" style="height:48px;opacity:0.25;border:1px dashed #320F99;border-radius:6px;padding:4px"/>
      <span style="font-family:Poppins;font-size:1.1rem;color:rgba(10,5,26,.55);text-align:center;max-width:120px">Outline-only / extra strokes</span>
    </div>
  </div>
</body></html>
