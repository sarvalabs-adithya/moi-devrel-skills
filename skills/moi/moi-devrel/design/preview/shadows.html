<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:32px;justify-content:center;background:#FBFAFF">
  <div class="row" style="gap:24px;align-items:center;justify-content:space-around">
    <div class="col" style="align-items:center;gap:10px">
      <div style="width:80px;height:80px;background:#fff;border-radius:20px;box-shadow:0 2px 6px rgba(50,15,153,.05),0 4px 12px rgba(50,15,153,.05)"></div>
      <span class="t-mono" style="font-size:1.2rem;color:#4B17E5">card-sm</span>
    </div>
    <div class="col" style="align-items:center;gap:10px">
      <div style="width:80px;height:80px;background:#fff;border-radius:20px;box-shadow:0 4px 12px rgba(50,15,153,.08),0 12px 32px rgba(50,15,153,.07)"></div>
      <span class="t-mono" style="font-size:1.2rem;color:#4B17E5">card</span>
    </div>
    <div class="col" style="align-items:center;gap:10px">
      <div style="width:80px;height:80px;background:#fff;border-radius:20px;box-shadow:0 8px 24px rgba(50,15,153,.10),0 24px 64px rgba(50,15,153,.10)"></div>
      <span class="t-mono" style="font-size:1.2rem;color:#4B17E5">card-lg</span>
    </div>
    <div class="col" style="align-items:center;gap:10px">
      <div style="width:80px;height:80px;background:radial-gradient(circle at 30% 25%,#9871F2 0,#4B17E5 55%,#320F99 100%);border-radius:999px;box-shadow:inset 0 1.45px 33px rgba(255,255,255,.25)"></div>
      <span class="t-mono" style="font-size:1.2rem;color:#4B17E5">inner-bright (signature)</span>
    </div>
    <div class="col" style="align-items:center;gap:10px">
      <div style="width:80px;height:80px;background:#4B17E5;border-radius:20px;box-shadow:0 0 40px rgba(75,23,229,.40)"></div>
      <span class="t-mono" style="font-size:1.2rem;color:#4B17E5">glow</span>
    </div>
  </div>
</body></html>
