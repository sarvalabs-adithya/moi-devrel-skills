<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="eyebrow">Signal & status</div>
  <div class="row" style="gap:8px">
    <div class="swatch" style="background:#1FAE6B;flex:1;min-height:80px"><span class="name">ok</span><span class="hex">#1FAE6B</span></div>
    <div class="swatch" style="background:#F2A742;flex:1;min-height:80px"><span class="name">warn</span><span class="hex">#F2A742</span></div>
    <div class="swatch" style="background:#E2336B;flex:1;min-height:80px"><span class="name">error</span><span class="hex">#E2336B</span></div>
    <div class="swatch" style="background:#009EF7;flex:1;min-height:80px"><span class="name">info</span><span class="hex">#009EF7</span></div>
    <div class="swatch" style="background:#E20FBF;flex:1;min-height:80px"><span class="name">signal - sparingly</span><span class="hex">#E20FBF</span></div>
  </div>
</body></html>
