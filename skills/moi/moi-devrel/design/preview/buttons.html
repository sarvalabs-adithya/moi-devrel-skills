<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:24px 28px;justify-content:center">
  <div class="eyebrow">Buttons · primary / secondary / ghost / icon</div>
  <div class="row" style="gap:12px;align-items:center">
    <button style="all:unset;cursor:pointer;font-family:var(--font-sans);font-weight:600;font-size:1.6rem;color:#F5F2FF;background:#4B17E5;padding:14px 22px;border-radius:999px;box-shadow:0 6px 20px rgba(75,23,229,.30)">Become a participant</button>
    <button style="all:unset;cursor:pointer;font-family:var(--font-sans);font-weight:600;font-size:1.6rem;color:#320F99;background:#F0EBFF;padding:14px 22px;border-radius:999px;border:1px solid #D9CEFA">Read the whitepaper</button>
    <button style="all:unset;cursor:pointer;font-family:var(--font-sans);font-weight:600;font-size:1.6rem;color:#4B17E5;padding:14px 18px;border-radius:999px">View docs →</button>
    <button title="Revoke" style="all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;background:#F0EBFF;color:#4B17E5;border:1px solid #D9CEFA">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
    </button>
  </div>
</body></html>
