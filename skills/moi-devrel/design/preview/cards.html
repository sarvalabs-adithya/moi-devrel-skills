<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:24px;background:#FBFAFF;justify-content:center">
  <div class="row" style="gap:14px;align-items:stretch">
    <div style="flex:1;background:#fff;border-radius:20px;border:1px solid rgba(217,204,255,.5);padding:18px;box-shadow:0 12px 32px rgba(50,15,153,.07);display:flex;flex-direction:column;gap:8px">
      <div style="display:inline-flex;align-self:flex-start;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:linear-gradient(180deg,#4B17E5,#320F99);color:#F5F2FF;box-shadow:inset 0 1px 12px rgba(255,255,255,.25)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></svg>
      </div>
      <div style="font-family:var(--font-sans);font-weight:600;font-size:1.8rem;color:#320F99">[Card title]</div>
      <div style="font-family:var(--font-sans);font-size:1.4rem;line-height:1.4;color:#4D29B1">[One sentence.]</div>
    </div>
    <div style="flex:1;background:#0A0026;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;color:#F5F2FF;position:relative;overflow:hidden">
      <div style="position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#9871F2,#4B17E5 60%,#320F99);box-shadow:inset 0 1.45px 33px rgba(255,255,255,.25);opacity:.8"></div>
      <div style="font-family:var(--font-mono);font-weight:700;font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase;color:#9871F2;position:relative">[LABEL]</div>
      <div style="font-family:var(--font-sans);font-weight:700;font-size:2rem;line-height:1.1;position:relative">[Card title]</div>
    </div>
    <div style="flex:1;background:linear-gradient(180deg,#F5F2FF,#D9CCFF);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;color:#320F99">
      <div style="font-family:var(--font-mono);font-weight:700;font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase;color:#4B17E5">[LABEL]</div>
      <div style="font-family:var(--font-sans);font-weight:700;font-size:2rem;line-height:1.1">[Card title]</div>
    </div>
  </div>
</body></html>
