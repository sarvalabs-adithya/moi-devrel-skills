<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:0;min-height:220px">
  <div class="row" style="gap:0;align-items:stretch;height:220px;border-radius:16px;overflow:hidden">
    <!-- cosmos with dots -->
    <div style="flex:1;background:#0A0026;position:relative;background-image:radial-gradient(rgba(217,204,255,.4) 1.2px,transparent 1.2px);background-size:18px 18px"></div>
    <!-- twilight radar -->
    <div style="flex:1;background:linear-gradient(180deg,#0A0026,#320F99);position:relative">
      <div style="position:absolute;left:50%;top:50%;width:120px;height:120px;border-radius:50%;border:1px solid rgba(217,204,255,.25);transform:translate(-50%,-50%)"></div>
      <div style="position:absolute;left:50%;top:50%;width:80px;height:80px;border-radius:50%;border:1px solid rgba(217,204,255,.35);transform:translate(-50%,-50%)"></div>
      <div style="position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;background:#9871F2;box-shadow:inset 0 2px 12px rgba(255,255,255,.4);transform:translate(-50%,-50%)"></div>
    </div>
    <!-- soft star bloom -->
    <div style="flex:1;background:linear-gradient(180deg,#F5F2FF,#D9CCFF);position:relative;overflow:hidden">
      <img src="../assets/icons/soft-star.svg" style="position:absolute;width:220px;height:220px;right:-40px;top:-40px;filter:invert(20%) sepia(80%) saturate(2500%) hue-rotate(248deg) brightness(80%);opacity:.5"/>
    </div>
    <!-- gradient orb on lavender -->
    <div style="flex:1;background:#9871F2;position:relative;overflow:hidden">
      <div style="position:absolute;top:-30px;right:-30px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#9871F2,#4B17E5 55%,#320F99);box-shadow:inset 0 1.45px 33px rgba(255,255,255,.25)"></div>
    </div>
  </div>
</body></html>
